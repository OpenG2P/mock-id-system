{{- if .Values.identitySeed.enabled }}
{{- /*
  Seeds the mock identity system with the SAME people the registries hold.

  Why this exists
  ---------------
  eSignet authenticates a beneficiary against this mock identity system, and the
  registry then checks that the authenticated subject equals the record's
  foundational_id. If the two sides hold different people — or this system holds
  none, which is the default — every authentication fails and nothing can be
  issued.

  Master Data Service is the single source. The registries already seed
  themselves from `g2p_sample_individuals` and set
  `foundational_id = national_id` (see each registry's db-seed
  load_sample_data.py), so seeding this system from the same column makes the
  two match by construction rather than by coincidence.

  Shape
  -----
  initContainer  reads MDS over the network with psql and writes one
                 "<individual_id>\t<request body>" line per person.
  main container waits for this system's API, then GETs each id and POSTs only
                 the ones that are absent — so re-running on upgrade is safe.

  Both use stock images; nothing is installed at run time.
*/ -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ template "common.names.fullname" . }}-identity-seed
  labels: {{- include "common.labels.standard" (dict "customLabels" .Values.commonLabels "context" $) | nindent 4 }}
  annotations:
    {{- if .Values.commonAnnotations }}
    {{- include "common.tplvalues.render" (dict "value" .Values.commonAnnotations "context" $) | nindent 4 }}
    {{- end }}
    {{- /* Runs after postgres-init (weight 0) has created the schema, and on
           upgrades too so a re-seeded MDS propagates. */}}
    {{- include "common.tplvalues.render" (dict "value" .Values.identitySeed.commonAnnotations "context" $) | nindent 4 }}
spec:
  backoffLimit: {{ .Values.identitySeed.backoffLimit }}
  {{- if .Values.identitySeed.ttlSecondsAfterFinished }}
  ttlSecondsAfterFinished: {{ .Values.identitySeed.ttlSecondsAfterFinished }}
  {{- end }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ template "common.names.fullname" . }}-identity-seed
        app.kubernetes.io/instance: {{ .Release.Name }}
        sidecar.istio.io/inject: "false"
    spec:
      {{- include "mock-identity-system.imagePullSecrets" . | nindent 6 }}
      restartPolicy: Never
      volumes:
        - name: payloads
          emptyDir: {}
      initContainers:
        - name: fetch-from-master-data
          image: {{ include "common.images.image" (dict "imageRoot" .Values.identitySeed.psqlImage "global" .Values.global) }}
          imagePullPolicy: {{ .Values.identitySeed.psqlImage.pullPolicy }}
          env:
            - name: PGHOST
              value: {{ tpl .Values.identitySeed.masterData.host $ | quote }}
            - name: PGPORT
              value: {{ .Values.identitySeed.masterData.port | quote }}
            - name: PGDATABASE
              value: {{ tpl .Values.identitySeed.masterData.database $ | quote }}
            - name: PGUSER
              value: {{ tpl .Values.identitySeed.masterData.user $ | quote }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ tpl .Values.identitySeed.masterData.existingSecret $ | quote }}
                  key: {{ .Values.identitySeed.masterData.existingSecretKey | quote }}
            - name: SEED_LANG
              value: {{ .Values.identitySeed.language | quote }}
            - name: SEED_PIN
              value: {{ .Values.identitySeed.defaultPin | quote }}
            - name: SEED_PHOTO
              value: {{ .Values.identitySeed.defaultEncodedPhoto | quote }}
            - name: SEED_BIO_FORMAT
              value: {{ .Values.identitySeed.biometrics.format | quote }}
            - name: SEED_BIO_VERSION
              value: {{ .Values.identitySeed.biometrics.version | quote }}
            - name: SEED_BIO_VALUE
              value: {{ .Values.identitySeed.biometrics.value | quote }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              echo "[identity-seed] waiting for master-data at $PGHOST:$PGPORT ..."
              until pg_isready -h "$PGHOST" -p "$PGPORT" -q; do sleep 3; done

              # A person with no national_id cannot be authenticated against, and
              # one with no birth_date would have to have a date invented — the
              # registries used to do exactly that (birth_year plus 01-01) and it
              # put a wrong date on real records. Skip both rather than guess.
              # SQL comes in on stdin, not via -c: psql only interpolates
              # :'variables' when reading a script, so -c left them literal and the
              # statement failed to parse.
              psql -v ON_ERROR_STOP=1 -tA -F"$(printf '\t')" \
                   -v lang="$SEED_LANG" -v pin="$SEED_PIN" -v photo="$SEED_PHOTO" \
                   -v biofmt="$SEED_BIO_FORMAT" -v biover="$SEED_BIO_VERSION" -v bioval="$SEED_BIO_VALUE" \
                   > /data/identities.tsv <<'SQL'
              -- Whitespace is stripped here as well as in the Master Data
              -- loader. eSignet matches individualId EXACTLY, so a grouped ID
              -- ("4028 6914 8701") seeded here can only ever be authenticated
              -- by typing the spaces, and the registry's foundational_id has to
              -- carry the identical string. Normalising on the way in means an
              -- older MDS still holding grouped IDs seeds usable identities.
              SELECT regexp_replace(national_id, '\s', '', 'g') AS national_id,
                     json_build_object(
                       'requestTime', to_char(now() AT TIME ZONE 'utc','YYYY-MM-DD"T"HH24:MI:SS.MS"Z"'),
                       'request', json_strip_nulls(json_build_object(
                         'individualId', regexp_replace(national_id, '\s', '', 'g'),
                         'pin',          :'pin',
                         'name',         json_build_array(json_build_object('language', :'lang', 'value', full_name)),
                         'givenName',    CASE WHEN given_name IS NULL THEN NULL
                                              ELSE json_build_array(json_build_object('language', :'lang', 'value', given_name)) END,
                         'gender',       CASE WHEN gender IS NULL THEN NULL
                                              ELSE json_build_array(json_build_object('language', :'lang', 'value', gender)) END,
                         'dateOfBirth',  to_char(birth_date,'YYYY/MM/DD'),
                         'phone',        phone,
                         'locale',       :'lang',
                         'encodedPhoto', :'photo',
                         'individualBiometrics', json_build_object(
                            'format',  :'biofmt',
                            'version', (:'biover')::numeric,
                            'value',   :'bioval'
                         )
                       ))
                     )
              FROM g2p_sample_individuals
              WHERE national_id IS NOT NULL
                AND birth_date  IS NOT NULL
              ORDER BY 1;
              SQL

              echo "[identity-seed] $(wc -l < /data/identities.tsv) identities read from master-data."
          volumeMounts:
            - name: payloads
              mountPath: /data
      containers:
        - name: seed
          image: {{ include "common.images.image" (dict "imageRoot" .Values.identitySeed.curlImage "global" .Values.global) }}
          imagePullPolicy: {{ .Values.identitySeed.curlImage.pullPolicy }}
          env:
            - name: API
              value: {{ tpl .Values.identitySeed.apiBaseUrl $ | quote }}
            - name: READY_TIMEOUT
              value: {{ .Values.identitySeed.readinessTimeoutSeconds | quote }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              if [ ! -s /data/identities.tsv ]; then
                echo "[identity-seed] master-data holds no seedable individuals — nothing to do."
                exit 0
              fi

              echo "[identity-seed] waiting for the identity API at $API ..."
              waited=0
              until curl -s -o /dev/null "$API/identity/readiness-probe"; do
                waited=$((waited+3))
                if [ "$waited" -ge "$READY_TIMEOUT" ]; then
                  echo "[identity-seed] the identity API did not become reachable in ${READY_TIMEOUT}s."
                  exit 1
                fi
                sleep 3
              done

              created=0; skipped=0; failed=0
              while IFS="$(printf '\t')" read -r id payload; do
                [ -n "$id" ] || continue
                # National ids carry spaces (e.g. "1216 5437 7346"), which cannot
                # go into a URL path raw.
                enc=$(echo "$id" | sed 's/ /%20/g')

                # This API answers HTTP 200 even when the identity does not exist —
                # the outcome is in the BODY ("response":null plus an errors
                # array). Checking the status code alone reported every missing
                # identity as already present, so a run "succeeded" having created
                # nothing. Inspect the body, for the lookup AND for the write.
                body=$(curl -s "$API/identity/$enc" 2>/dev/null | tr -d ' ')
                case "$body" in
                  *'"response":null'*|*errorCode*) : ;;   # absent -> create it
                  '')                              : ;;   # no answer -> try to create
                  *) skipped=$((skipped+1)); continue ;;  # present -> leave alone
                esac

                out=$(printf '%s' "$payload" | curl -s -X POST \
                        -H 'Content-Type: application/json' --data @- "$API/identity" 2>/dev/null | tr -d ' ')
                case "$out" in
                  *errorCode*|'')
                    failed=$((failed+1))
                    echo "[identity-seed] FAILED $id -> $(printf '%s' "$out" | cut -c1-160)"
                    ;;
                  *)
                    created=$((created+1))
                    ;;
                esac
              done < /data/identities.tsv

              echo "[identity-seed] created=$created skipped(existing)=$skipped failed=$failed"
              # A failure here means beneficiaries cannot authenticate, so it must
              # not be reported as a healthy install.
              [ "$failed" -eq 0 ]
          volumeMounts:
            - name: payloads
              mountPath: /data
{{- end }}
